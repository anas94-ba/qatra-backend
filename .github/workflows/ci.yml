name: CI
on:
  push: { branches: [main, develop] }
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: qatra, POSTGRES_PASSWORD: qatra, POSTGRES_DB: qatra_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U qatra" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://qatra:qatra@localhost:5432/qatra_test
      JWT_SECRET: ci-secret-ci-secret-ci-secret
      JOBS_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx prisma generate
        working-directory: apps/api
      - run: npx prisma migrate deploy
        working-directory: apps/api
      - run: npm run lint -w @qatra/api
      - run: npm test -w @qatra/api -- --coverage
      - run: npm run test:e2e -w @qatra/api
      - run: npm run build -w @qatra/api
      - run: npm audit --audit-level=high --omit=dev
